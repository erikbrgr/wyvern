name: sync

on:
  pull_request:
    paths:
      - packages/sync-core/**
      - editors/vscode-sync/**
      - .github/workflows/sync.yml
  push:
    branches:
      - main
    paths:
      - packages/sync-core/**
      - editors/vscode-sync/**

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sync-core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/sync-core/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm test

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode-sync
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode-sync/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npx vsce package --out wyvern-sync.vsix
