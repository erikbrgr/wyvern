[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wyvern-lsp"
version = "0.1.1"
description = "An LSP for Draconic, providing diagnostics, hover docs, and code completion for Avrae alias scripting."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Erik Burger" }]
requires-python = ">=3.11"
keywords = ["avrae", "draconic", "lsp", "language-server", "d&d", "discord"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pygls>=2.0.0",
    "lsprotocol>=2025.0.0",
]

[project.urls]
Homepage = "https://github.com/erikbrgr/wyvern"
Source = "https://github.com/erikbrgr/wyvern"
Issues = "https://github.com/erikbrgr/wyvern/issues"

[project.scripts]
wyvern = "wyvern.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "mypy>=1.8",
    "ruff>=0.4",
]

[tool.hatch.build.targets.sdist]
# Whitelist what goes into the source archive, so local tool folders
# (.claude/, .remember/, editors/, worktrees) never get published.
include = [
    "/wyvern",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["wyvern"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["wyvern"]
