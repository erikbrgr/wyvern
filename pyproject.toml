[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wyvern-lsp"
version = "0.1.0"
description = "A Language Server for Avrae's Draconic scripting language"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pygls>=2.0.0",
    "lsprotocol>=2025.0.0",
]

[project.scripts]
wyvern = "wyvern.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "mypy>=1.8",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wyvern"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/wyvern"]
